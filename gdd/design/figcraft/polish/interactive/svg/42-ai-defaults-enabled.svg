<text id="text-w400-n22" x="529.6875" y="368.9140625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="13px" font-weight="400">Used only when you start a dictation.</text>
