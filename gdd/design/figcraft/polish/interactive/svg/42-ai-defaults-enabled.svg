<text id="text-w400-n20" x="270.390625" y="389.40625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">and insertion in other apps.</text>
<line x1="529.6875" y1="390.671875" x2="1239.984375" y2="390.671875" stroke="rgb(220, 214, 202)" stroke-width="1"/>
