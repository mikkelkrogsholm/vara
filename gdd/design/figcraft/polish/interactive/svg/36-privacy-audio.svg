<text id="text-w400-n13" x="563.6875" y="26.71875" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">Audio: On this device</text>
<svg x="529.6875" y="55.984375" width="20" height="20" class="icon " viewBox="0 0 24 24" fill="none" stroke="rgb(99, 100, 89)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c6 5 6 13 0 18-6-5-6-13 0-18Z"></path></svg>
<text id="text-w400-n14" x="563.6875" y="71.21875" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">Text: Direct transcription by default</text>
<text id="text-w400-n15" x="563.6875" y="98.71875" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">Apps with custom rules use their selected AI.</text>
<text id="text-w400-n16" x="529.6875" y="143.21875" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">Cloud is used only for the features you choose.</text>
<line x1="270.390625" y1="401.984375" x2="1240" y2="401.984375" stroke="rgb(220, 214, 202)" stroke-width="1"/>
<text id="text-w500-n17" x="270.390625" y="220.984375" fill="rgb(37, 37, 31)" font-family="Georgia, Noto Serif, Liberation Serif, serif" letter-spacing="-0.36" font-size="24px" font-weight="500">History</text>
<text id="text-w400-n18" x="270.390625" y="252.71875" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">Your dictations are saved locally,</text>
<text id="text-w400-n19" x="270.390625" y="275.21875" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">grouped by app.</text>
<text id="text-w600-n20" x="529.6875" y="213.4765625" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="14px" font-weight="600">Keep text</text>
<text id="text-w400-n22" x="529.6875" y="324.21875" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">You can choose to delete automatically after a period.</text>
<text id="text-w400-n23" x="529.6875" y="372.2265625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="13px" font-weight="400">Deleting a dictation deletes both the original and processed text.</text>
<line x1="270.390625" y1="628.484375" x2="1240" y2="628.484375" stroke="rgb(220, 214, 202)" stroke-width="1"/>
<text id="text-w500-n24" x="270.390625" y="449.484375" fill="rgb(37, 37, 31)" font-family="Georgia, Noto Serif, Liberation Serif, serif" letter-spacing="-0.36" font-size="24px" font-weight="500">Audio</text>
<text id="text-w400-n25" x="270.390625" y="481.21875" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">No audio in history.</text>
<svg x="529.6875" y="427.984375" width="20" height="20" class="icon " viewBox="0 0 24 24" fill="none" stroke="rgb(99, 100, 89)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"></path></svg>
<text id="text-w400-n26" x="563.6875" y="443.21875" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">After successful transcription</text>
<text id="text-w400-n27" x="563.6875" y="470.71875" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">The audio is deleted automatically.</text>
<svg x="529.6875" y="499.984375" width="20" height="20" class="icon " viewBox="0 0 24 24" fill="none" stroke="rgb(99, 100, 89)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 6v6l4 2"></path></svg>
<text id="text-w400-n28" x="563.6875" y="515.21875" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">If transcription fails</text>
<text id="text-w400-n29" x="563.6875" y="542.71875" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="15px" font-weight="400">Audio is stored temporarily for up to 24 hours so you can retry.</text>
<text id="text-w400-n30" x="529.6875" y="590.7265625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0" font-size="13px" font-weight="400">A successful retry or deletion removes the audio sooner.</text>
</g>
</g>
