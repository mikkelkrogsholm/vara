<text  x="270.390625" y="342.140625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">or AI instructions.</text>
<text  x="529.6875" y="235.790625" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="bold">Interface language</text>
<line x1="270.390625" y1="643.390625" x2="1240" y2="643.390625" stroke="rgb(220, 214, 202)" stroke-width="1"/>
<text  x="270.390625" y="398.290625" fill="rgb(37, 37, 31)" font-family="Georgia, &quot;Noto Serif&quot;, &quot;Liberation Serif&quot;, serif" font-size="24px" font-weight="normal">Processing</text>
<text  x="270.390625" y="429.640625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">You decide where your data is</text>
<text  x="270.390625" y="452.140625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">processed.</text>
<text  x="529.6875" y="407.790625" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="bold">On-device processing only</text>
<text  x="529.6875" y="431.440625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="13px" font-weight="normal">When enabled, Vara can only use local models.</text>
