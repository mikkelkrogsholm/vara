<svg x="529.6875" y="523.890625" width="20" height="20" class="icon " viewBox="0 0 24 24" fill="none" stroke="rgb(99, 100, 89)" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c6 5 6 13 0 18-6-5-6-13 0-18Z"></path></svg>
<text  x="563.6875" y="538.140625" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">Text: Direct transcription by default</text>
<text  x="563.6875" y="565.640625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">Apps with custom rules use their selected AI.</text>
<text  x="529.6875" y="610.140625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">Cloud is used only for the features you choose.</text>
<line x1="270.390625" y1="863.890625" x2="1240" y2="863.890625" stroke="rgb(220, 214, 202)" stroke-width="1"/>
<text  x="270.390625" y="692.290625" fill="rgb(37, 37, 31)" font-family="Georgia, &quot;Noto Serif&quot;, &quot;Liberation Serif&quot;, serif" font-size="24px" font-weight="normal">History</text>
<text  x="270.390625" y="723.640625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">Your dictations are saved locally,</text>
<text  x="270.390625" y="746.140625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">grouped by app.</text>
<text  x="529.6875" y="684.790625" fill="rgb(37, 37, 31)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="14px" font-weight="bold">Keep text</text>
<text  x="529.6875" y="783.140625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15px" font-weight="normal">You can choose to delete automatically after a period.</text>
<text  x="529.6875" y="830.940625" fill="rgb(99, 100, 89)" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="13px" font-weight="normal">Deleting a dictation deletes both the original and processed text.</text>
