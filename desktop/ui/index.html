<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Vara</title>
    <link rel="stylesheet" href="design/styles/tokens.css" />

    <script src="boot.js" defer></script>
